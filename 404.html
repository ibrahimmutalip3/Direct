<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>Page Not Found — Direct</title>
    <link rel="icon" href="./assets/logo.svg">
    <link rel="stylesheet" href="./style.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px 20px;
        }

        .error-content {
            max-width: 600px;
        }

        .error-code {
            font-size: clamp(110px, 25vw, 190px);
            line-height: 1;
            font-weight: 800;
            letter-spacing: -12px;
            color: #d8ff64;
        }

        .error-content h1 {
            font-size: 32px;
            margin: 25px 0 12px;
        }

        .error-content p {
            color: #999;
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .error-home {
            display: inline-block;
            padding: 14px 25px;
            border-radius: 14px;
            background: #d8ff64;
            color: #101010;
            font-weight: 700;
            text-decoration: none;
            transition: transform .2s;
        }

        .error-home:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>
    <main class="error-page">
        <div class="error-content">
            <div class="error-code">404</div>
            <h1>Lost your way?</h1>
            <p>
                The page you're looking for doesn't exist
                or may have been moved.
            </p>
            <a class="error-home" href="./index.html">
                Back to Direct
            </a>
        </div>
    </main>
</body>
</html>
