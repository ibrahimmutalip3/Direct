
name: Sync Releases to Direct

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub Release tag"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: direct-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$EVENT_TAG"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Processing release: $TAG"

      - name: Download release information
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            > "$RUNNER_TEMP/release.json"

      - name: Download IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipa"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.ipa" \
            --dir "$RUNNER_TEMP/ipa"

          count=$(find "$RUNNER_TEMP/ipa" -maxdepth 1 -name "*.ipa" | wc -l)

          if [ "$count" -ne 1 ]; then
            echo "Expected exactly one IPA file, found $count"
            exit 1
          fi

      - name: Update app catalog and manifest
        run: |
          python scripts/sync_release.py \
            "$RUNNER_TEMP/release.json" \
            "$RUNNER_TEMP/ipa"

      - name: Commit changes
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add apps.json manifests/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: sync release $RELEASE_TAG"
          git push origin HEAD:main
